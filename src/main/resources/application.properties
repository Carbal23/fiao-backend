spring.config.import=optional:file:${FIAO_ENV_FILE:.env.local}[.properties]
server.port=${PORT:3000}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:fiao_db}}
spring.datasource.username=${PG_USER:}
spring.datasource.password=${PG_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.flyway.enabled=true
fiao.database.baseline-existing-schema=${FIAO_FLYWAY_BASELINE_EXISTING_SCHEMA:false}
